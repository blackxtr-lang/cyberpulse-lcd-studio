name: Build Windows EXE & Publish Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: cyberpulse-windows-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Read Version from version.json
        id: get_version
        shell: pwsh
        run: |
          $vjson = Get-Content "cyberpulse_studio/version.json" -Raw | ConvertFrom-Json
          $ver = $vjson.version
          Write-Host "Detected Version: v$ver"
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=v$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build CyberPulse_Studio.exe
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed `
            --name "CyberPulse_Studio" `
            --icon "cyberpulse_studio/cyberpulse.ico" `
            --paths "cyberpulse_studio" `
            --add-data "cyberpulse_studio/cyberpulse.ico;." `
            --add-data "cyberpulse_studio/checkmark.png;." `
            --add-data "cyberpulse_studio/radio_checked.png;." `
            --add-data "cyberpulse_studio/version.json;." `
            --hidden-import "i18n" `
            --hidden-import "case_screen_profiles" `
            --hidden-import "game_profile_manager" `
            --hidden-import "hardware_driver" `
            --hidden-import "sensor_monitor" `
            --hidden-import "rgb_studio_gui" `
            "cyberpulse_studio/main_gui.py"

      - name: Package Portable Release ZIP
        run: |
          New-Item -ItemType Directory -Force -Path "dist/CyberPulse_Studio/themes" | Out-Null
          Copy-Item "cyberpulse_studio/cyberpulse.ico" "dist/CyberPulse_Studio/" -Force
          Copy-Item "cyberpulse_studio/checkmark.png" "dist/CyberPulse_Studio/" -Force
          Copy-Item "cyberpulse_studio/radio_checked.png" "dist/CyberPulse_Studio/" -Force
          Copy-Item "cyberpulse_studio/version.json" "dist/CyberPulse_Studio/" -Force
          Compress-Archive -Path "dist/CyberPulse_Studio/*" -DestinationPath "CyberPulse_Studio_Windows_x64.zip" -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberPulse_Studio_Windows_x64
          path: CyberPulse_Studio_Windows_x64.zip

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: "⚡ CyberPulse LCD Studio ${{ steps.get_version.outputs.tag }} — Windows Portable (.exe)"
          body: |
            ## 🇹🇷 Türkçe — Kurulumsuz Taşınabilir Windows Sürümü (.exe) — ${{ steps.get_version.outputs.tag }}
            ### ✨ Yenilikler (${{ steps.get_version.outputs.tag }})
            - **🎮 14+ Oyun Başlatıcısı (Launcher) Otomatik Tarama:** Steam, Epic Games, Xbox / PC Game Pass (`.GamingRoot`), Riot Games, EA App, Ubisoft Connect, Battle.net, GOG Galaxy, Rockstar Games, Amazon Games, Heroic, itch.io, HoYoPlay, Wargaming ve özel oyun klasörlerini otomatik tarar.
            - **📌 Her Tema İçin Ayrı Düzen Kaydetme & ☑️ Seçmeli Düzen Aktarımı:** `📌 Bu Temaya Kaydet (Ctrl+S)` ile düzeni yalnızca aktif temaya kaydedin veya `🔄 Tümüne Uygula` penceresinden seçtiğiniz temalara aktarın.
            - **🎛️ Canlı Ses / Müzik Ekolayzırı (WASAPI Audio Visualizer):** 24-bant Dikey LED Barlar (Bars) ve Akıcı Ses Dalgası (Wave).
            - **⚡ Yeni Donanım & Oyun Sensörleri:** GPU VRAM (6 gösterim modu), GPU Hotspot, GPU/CPU Güç Tüketimi (`W`), Sıvı Soğutma (AIO) & Anakart sıcaklığı, `1% Low FPS`, `Frametime (ms)` ve `Oyun Oturum Süresi` sayacı.
            - **🎨 Tek Tıkla Tema Renk Paletleri, 🖌️ Stil Kopyala/Yapıştır, 🔗 Katman Gruplama (`Ctrl+G`) & 🎬 GIF/MP4 Çıktı:** Aktif temayı tek tıkla 6 hazır renk paletine dönüştürün, araç stillerini kopyalayın ve hareketli GIF/MP4 olarak dışa aktarın.
            - **☀️ Parlaklık Kontrolü & 🌙 Windows Kilidi (`Win+L`) IPS Koruması:** Üst bardan ekran parlaklığını ayarlayın; bilgisayar kilitlendiğinde kasa ekranı otomatik uyku moduna geçer.

            ### 📥 Kurulumsuz Kullanım
            1. Aşağıdaki **`CyberPulse_Studio_Windows_x64.zip`** dosyasını indirin ve bir klasöre çıkartın.
            2. Klasör içindeki **`CyberPulse_Studio.exe`** dosyasına çift tıklayarak doğrudan çalıştırın (Python kurulumu gerektirmez).
            3. Sol menünün altındaki **`🌐 Dil: TR / EN`** butonuyla Türkçe ve İngilizce arasında anında geçiş yapabilirsiniz.

            ---

            ## 🇬🇧 English — Portable Windows Release (.exe) — ${{ steps.get_version.outputs.tag }}
            ### ✨ What's New (${{ steps.get_version.outputs.tag }})
            - **🎮 14+ Game Launcher Auto-Discovery:** Automatically scans Steam, Epic Games, Xbox / PC Game Pass (`.GamingRoot`), Riot Games, EA App, Ubisoft Connect, Battle.net, GOG Galaxy, Rockstar Games, Amazon Games, Heroic, itch.io, HoYoPlay, Wargaming, and custom folders.
            - **📌 Per-Theme Layout Saving & ☑️ Selective Multi-Theme Sync:** Save layout changes only to the active theme (`Ctrl+S`) or selectively sync across checked themes of the same resolution.
            - **🎛️ Live WASAPI Audio Visualizer:** Real-time 24-band Vertical LED Bars and Smooth Neon Waveform widgets.
            - **⚡ New Hardware & Gaming Telemetry:** GPU VRAM (6 display modes), GPU Hotspot, GPU/CPU Power Draw (`W`), Liquid Cooler (AIO) & Motherboard Temp, `1% Low FPS`, `Frametime (ms)`, and `Game Session Timer`.
            - **🎨 1-Click Color Palettes, 🖌️ Style Copy/Paste, 🔗 Layer Grouping (`Ctrl+G`) & 🎬 GIF/MP4 Export.**
            - **☀️ Brightness Slider & 🌙 Windows Lock (`Win+L`) Auto-Standby.**

            ### 📥 Quick Start
            1. Download **`CyberPulse_Studio_Windows_x64.zip`** below and extract it to any folder.
            2. Double-click **`CyberPulse_Studio.exe`** to launch immediately (no Python installation required).
            3. Switch between **English** and **Turkish** anytime using the **`🌐 Language: EN / TR`** button in the left sidebar.
          files: CyberPulse_Studio_Windows_x64.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
