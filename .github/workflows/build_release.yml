name: Build Windows EXE & Publish Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build CyberPulse_Studio.exe
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed `
            --name "CyberPulse_Studio" `
            --icon "cyberpulse_studio/cyberpulse.ico" `
            --paths "cyberpulse_studio" `
            --add-data "cyberpulse_studio/cyberpulse.ico;." `
            --add-data "cyberpulse_studio/checkmark.png;." `
            --add-data "cyberpulse_studio/radio_checked.png;." `
            --add-data "cyberpulse_studio/version.json;." `
            --hidden-import "i18n" `
            --hidden-import "case_screen_profiles" `
            --hidden-import "game_profile_manager" `
            --hidden-import "hardware_driver" `
            --hidden-import "sensor_monitor" `
            --hidden-import "rgb_studio_gui" `
            "cyberpulse_studio/main_gui.py"

      - name: Package Portable Release ZIP
        run: |
          New-Item -ItemType Directory -Force -Path "dist/CyberPulse_Studio/themes" | Out-Null
          Copy-Item "cyberpulse_studio/cyberpulse.ico" "dist/CyberPulse_Studio/" -Force
          Copy-Item "cyberpulse_studio/checkmark.png" "dist/CyberPulse_Studio/" -Force
          Copy-Item "cyberpulse_studio/radio_checked.png" "dist/CyberPulse_Studio/" -Force
          Compress-Archive -Path "dist/CyberPulse_Studio/*" -DestinationPath "CyberPulse_Studio_Windows_x64.zip" -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberPulse_Studio_Windows_x64
          path: CyberPulse_Studio_Windows_x64.zip

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0
          name: "⚡ CyberPulse LCD Studio v1.3.0 — Windows Portable (.exe)"
          body: |
            ## 🇹🇷 Türkçe — Kurulumsuz Taşınabilir Windows Sürümü (.exe) — v1.3.0
            ### ✨ Yenilikler (v1.3.0)
            - **☕ Bana Bir Kahve Ismarla:** Sol menüye ve GitHub sayfasına doğrudan destek butonu eklendi.
            - **📐 Tuvale Göre Otomatik Pencere Boyutlandırma & Esnek Paneller:** Seçilen ekran çözünürlüğüne (`320×1480` dikey şerit veya `1920×1080` yatay ekran) göre pencere otomatik boyutlanır; elle büyütüp küçültüldüğünde tuval ve yan paneller yazıları kesmeden orantılı ölçeklenir.
            - **💾 Özelleştirilebilir RAM Gösterim Modları:** `Kullanılan GB`, `Kullanılan %`, `Kullanılan GB + %`, `Kalan/Boş GB`, `Kalan %`, `Kalan GB + %` seçenekleri eklendi; metin değeri ile altındaki ilerleme çubuğu her zaman birebir aynı oranı gösterir.
            - **🔄 Otomatik Güncelleme Denetleyicisi:** Uygulama her açılışta GitHub üzerinden yeni sürümü denetler ve otomatik günceller.

            ### 📥 Kurulumsuz Kullanım
            1. Aşağıdaki **`CyberPulse_Studio_Windows_x64.zip`** dosyasını indirin ve bir klasöre çıkartın.
            2. Klasör içindeki **`CyberPulse_Studio.exe`** dosyasına çift tıklayarak doğrudan çalıştırın (Python kurulumu gerektirmez).
            3. Sol menünün altındaki **`🌐 Dil: TR / EN`** butonuyla Türkçe ve İngilizce arasında anında geçiş yapabilirsiniz.

            ---

            ## 🇬🇧 English — Portable Windows Release (.exe) — v1.3.0
            ### ✨ What's New (v1.3.0)
            - **☕ Buy Me a Coffee Button:** Added direct GitHub Sponsors support button in the left navigation rail and README.
            - **📐 Adaptive Window Sizing & Unclipped Responsive Panels:** Window automatically adapts to the selected canvas resolution (`320×1480` portrait strip or `1920×1080` landscape) and scales proportionally without clipping any labels or controls.
            - **💾 Customizable RAM Display Modes:** Choose between `Used GB`, `Used %`, `Used GB + %`, `Free GB`, `Free %`, and `Free GB + %` with 100% synchronized progress bars.
            - **🔄 Automatic Startup Updater:** Checks GitHub on startup and installs updates automatically.

            ### 📥 Quick Start
            1. Download **`CyberPulse_Studio_Windows_x64.zip`** below and extract it to any folder.
            2. Double-click **`CyberPulse_Studio.exe`** to launch immediately (no Python installation required).
            3. Switch between **English** and **Turkish** anytime using the **`🌐 Language: EN / TR`** button in the left sidebar.
          files: CyberPulse_Studio_Windows_x64.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
